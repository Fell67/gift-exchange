# Controls when the workflow will run
on:
  # Allows me to trigger it from the UI
  workflow_dispatch:
  # Triggers the workflow on a push or pull request
  push:
    branches:
      - main
  pull_request:

# Allow the Deploy job to publish the built site to the deployment branch.
permissions:
  contents: write

# Here are the jobs that run for the workflow
jobs:
  CI-CD_pipeline:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo and setup the env
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18.16.x
          cache: npm
      - name: Install
        run: npm ci
      # Build the repo
      - name: Build
        run: npm run build
      # Unit Test
      - name: Unit Test
        run: npm run unit-test
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          if-no-files-found: error

  Deploy:
    needs: CI-CD_pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/
      - name: Deploy
        run: |
          git config --global user.email "${{ secrets.EMAIL }}"
          git config --global user.name "${{ secrets.USERNAME }}"
          git --work-tree dist add --all
          git --work-tree dist commit -m 'Deploy'
          git push origin HEAD:giftExchangeWebsite --force
